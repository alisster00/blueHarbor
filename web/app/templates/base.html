<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}BlueHarbor Solutions{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --surface2:  #22263a;
      --border:    #2e3250;
      --accent:    #4f6ef7;
      --accent-h:  #3a58e0;
      --danger:    #e05252;
      --success:   #52c87a;
      --text:      #e8eaf0;
      --text-muted:#7a80a0;
      --radius:    8px;
      --font:      'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: .6rem;
      font-weight: 700;
      font-size: 16px;
      color: var(--text);
      text-decoration: none;
    }

    .navbar-brand .logo-dot {
      width: 10px;
      height: 10px;
      background: var(--accent);
      border-radius: 50%;
      display: inline-block;
    }

    .navbar-right {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      font-size: 13px;
      color: var(--text-muted);
    }

    .badge {
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    .badge-admin   { background: rgba(79,110,247,.2); color: var(--accent); }
    .badge-viewer  { background: rgba(82,200,122,.15); color: var(--success); }

    .btn-logout {
      color: var(--text-muted);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: var(--radius);
      transition: background .15s;
    }
    .btn-logout:hover { background: var(--surface2); color: var(--text); }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }

    .card-header {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 1rem;
      padding-bottom: .75rem;
      border-bottom: 1px solid var(--border);
    }

    .alert {
      padding: .75rem 1rem;
      border-radius: var(--radius);
      font-size: 13px;
      margin-bottom: 1.2rem;
      border-left: 3px solid;
    }
    .alert-danger  { background: rgba(224,82,82,.1);  border-color: var(--danger);  color: #f08080; }
    .alert-success { background: rgba(82,200,122,.1); border-color: var(--success); color: #80e0a0; }

    .form-group   { margin-bottom: 1.1rem; }
    .form-label   { display: block; font-size: 12px; font-weight: 600;
                    color: var(--text-muted); margin-bottom: .4rem;
                    text-transform: uppercase; letter-spacing: .5px; }
    .form-control {
      width: 100%;
      padding: .6rem .9rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
      transition: border-color .15s;
      outline: none;
    }
    .form-control:focus  { border-color: var(--accent); }
    .form-control::placeholder { color: var(--text-muted); }

    textarea.form-control { resize: vertical; min-height: 100px; font-family: monospace; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .55rem 1.2rem;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background .15s, transform .1s;
      text-decoration: none;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--accent);  color: #fff; }
    .btn-primary:hover { background: var(--accent-h); }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--text); }
    .btn-full { width: 100%; justify-content: center; }

    .table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .table th {
      text-align: left; padding: .6rem 1rem;
      background: var(--surface2);
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .7px;
      border-bottom: 1px solid var(--border);
    }
    .table td {
      padding: .7rem 1rem;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }
    .table tr:last-child td { border-bottom: none; }
    .table tr:hover td { background: rgba(255,255,255,.02); }

    pre, code {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12px;
    }
    .code-block {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      overflow-x: auto;
      color: #a8d0ff;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem; }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.2rem 1.5rem;
    }
    .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase;
                  letter-spacing: .7px; margin-bottom: .3rem; }
    .stat-value { font-size: 28px; font-weight: 700; color: var(--text); }
    .stat-sub   { font-size: 12px; color: var(--text-muted); margin-top: .2rem; }
  </style>
</head>
<body>

{% block navbar %}{% endblock %}

{% block content %}{% endblock %}

</body>
</html>
